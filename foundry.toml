# Foundry configuration.
#
#   default profile  -> the current, remediated contracts (Solidity 0.8, OpenZeppelin 5) and the
#                       Foundry test suite. This is the main project: `forge build`, `forge test`.
#   legacy profile   -> the original 2019 contracts (Solidity 0.5.x, OpenZeppelin 2.4), kept as the
#                       documented "before" for the security review + H-01 PoC.
#                       Use with:  FOUNDRY_PROFILE=legacy forge build

[profile.default]
src = "contracts-v2"
test = "test-v2"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.legacy]
src = "contracts"
test = "test"          # override: don't inherit the default profile's 0.8 test-v2 dir
out = "out-legacy"
libs = ["node_modules"]
solc = "0.5.17"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
