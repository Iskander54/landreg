# Foundry configuration. Two worlds live in this repo:
#
#   default profile  -> the original 2019 contracts (Solidity 0.5.x, OpenZeppelin 2.4),
#                       kept as the documented "before". Used by `forge build` and the H-01 PoC.
#   v2 profile       -> the remediated contracts (Solidity 0.8, OpenZeppelin 5) plus Foundry
#                       tests that prove each fix. Run with:  FOUNDRY_PROFILE=v2 forge test

[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules"]
solc = "0.5.17"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[profile.v2]
src = "contracts-v2"
test = "test-v2"
out = "out-v2"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
